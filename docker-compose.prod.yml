version: "3.8"

services:
  # FastAPI Application - Production (Using Neon Cloud Database)
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: sopa_api_prod
    environment:
      # Use Neon database directly - no local PostgreSQL container
      DATABASE_URL: ${DATABASE_URL}
      NEON_DATABASE_URL: ${NEON_DATABASE_URL}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      PROJECT_NAME: "SOPA API - Production"
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_started
    networks:
      - sopa_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Redis for caching - Production
  redis:
    image: redis:7-alpine
    container_name: sopa_redis_prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data_prod:/data
    networks:
      - sopa_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Nginx Reverse Proxy (optional for production)
  nginx:
    image: nginx:alpine
    container_name: sopa_nginx_prod
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - api
    networks:
      - sopa_network
    restart: always

volumes:
  redis_data_prod:

networks:
  sopa_network:
    driver: bridge
