version: "3.8"

services:
  # PostgreSQL Database - Production (accessible from outside)
  postgres:
    image: postgres:15-alpine
    container_name: sopa_postgres_prod
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sopa_db}
      POSTGRES_USER: ${POSTGRES_USER:-sopa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      # Expose PostgreSQL to external tools (DBeaver, pgAdmin, etc.)
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sopa_user} -d ${POSTGRES_DB:-sopa_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sopa_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # FastAPI Application - Production (Using local PostgreSQL)
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: sopa_api_prod
    env_file:
      - .env.prod
    environment:
      # Use DATABASE_URL directly from .env.prod file
      DATABASE_URL: ${DATABASE_URL}
      NEON_DATABASE_URL: ${NEON_DATABASE_URL}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      PROJECT_NAME: "SOPA API - Production"
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - sopa_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Redis for caching - Production
  redis:
    image: redis:7-alpine
    container_name: sopa_redis_prod
    env_file:
      - .env.prod
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data_prod:/data
    networks:
      - sopa_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Nginx Reverse Proxy (optional for production)
  nginx:
    image: nginx:alpine
    container_name: sopa_nginx_prod
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - api
    networks:
      - sopa_network
    restart: always

volumes:
  postgres_data_prod:
  redis_data_prod:

networks:
  sopa_network:
    driver: bridge
